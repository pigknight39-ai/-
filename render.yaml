services:
  - type: web
    name: construction-leave
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/leave-data
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
